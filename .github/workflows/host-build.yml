name: Host build

on:
  push:
    branches: [main, rebase/**]
    tags: ['v*']
  pull_request:

concurrency:
  group: host-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sonix-player
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config libsdl2-dev libfreetype-dev \
            libopusfile-dev libwavpack-dev libasound2-dev libfdk-aac2 \
            ffmpeg sqlite3 xvfb xdotool scrot tesseract-ocr tesseract-ocr-eng
      - name: Compile the host simulator
        # The Makefile target is `host`; it builds sonix_player_host and clones
        # LVGL 9.6.0 on first use.
        run: make host -j2
      - name: Exercise audiobook catalog and resume
        working-directory: ${{ github.workspace }}
        env:
          SONIX_SMOKE_SKIP_BUILD: 1
        run: tools/audiobook-host-smoke.sh
      - name: Exercise the Audiobookshelf flow against the mock server
        working-directory: ${{ github.workspace }}
        env:
          SONIX_SMOKE_SKIP_BUILD: 1
        run: tools/audiobookshelf-host-smoke.sh
      - name: Check single-ear PCM routing
        working-directory: ${{ github.workspace }}
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sonix-player tools/singleear-test.c \
            sonix-player/src/system/audio/singleear.c -o /tmp/sonix-singleear-test
          /tmp/sonix-singleear-test
      - name: Check sleep timer with a controlled clock
        working-directory: ${{ github.workspace }}
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sonix-player -Wl,--wrap=clock_gettime,--wrap=time \
            tools/sleeptimer-test.c sonix-player/src/system/playback/sleeptimer.c -o /tmp/sonix-sleeptimer-test
          /tmp/sonix-sleeptimer-test
      - name: Exercise Audiobookshelf podcast playback and offline restart
        working-directory: ${{ github.workspace }}
        run: |
          SONIX_PODCAST_SMOKE_RSS=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_FORMAT=m4a tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_INTERRUPT=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_SYNC=1 SONIX_PODCAST_SMOKE_ART=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_FILTERS=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_ROW_DOWNLOAD=1 SONIX_PODCAST_SMOKE_ART=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_ROW_DOWNLOAD=1 SONIX_PODCAST_SMOKE_NO_DATE=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_DETAIL_QUEUE=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_SHOWS=1 SONIX_PODCAST_SMOKE_ART=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_LABELS=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_SLEEP=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_NEXT=large tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_SHOW_FILTERS=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_FROM_MUSIC=1 SONIX_PODCAST_SMOKE_ART=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_FROM_MUSIC=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_HANDOFF=1 tools/audiobookshelf-podcast-smoke.sh
          SONIX_PODCAST_SMOKE_HANDOFF=1 SONIX_PODCAST_SMOKE_FASTSTART=1 SONIX_PODCAST_SMOKE_FORMAT=m4a tools/audiobookshelf-podcast-smoke.sh
      - name: Check shared streaming artwork loader
        working-directory: ${{ github.workspace }}
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pthread -DLV_CONF_INCLUDE_SIMPLE \
            -I sonix-player -I sonix-player/lvgl/include tools/stream-art-test.c \
            sonix-player/src/gui/streaming/qobuzart.c sonix-player/src/system/core/md5.c -o /tmp/sonix-stream-art-test
          /tmp/sonix-stream-art-test "$(mktemp -d)"
      - name: Check offline TIDAL Downloads views
        working-directory: ${{ github.workspace }}
        run: |
          tools/tidal-downloads-ui-smoke.sh
          tools/tidal-downloads-ui-smoke.sh empty
          tools/tidal-downloads-ui-smoke.sh favourites
          tools/tidal-downloads-ui-smoke.sh saved
          tools/tidal-downloads-ui-smoke.sh local
          tools/tidal-downloads-ui-smoke.sh cache
          tools/tidal-downloads-ui-smoke.sh quality
          tools/tidal-downloads-ui-smoke.sh lyrics
          tools/tidal-downloads-ui-smoke.sh lyrics-stream
      - name: Check TIDAL download queue and R1 firmware tooling
        working-directory: ${{ github.workspace }}
        run: |
          tools/tidalkeep-test.sh
          python3 tools/pack-r1-test.py
      - name: Run upstream metadata and kernel-log regressions
        working-directory: ${{ github.workspace }}
        run: bash tools/upstream-regression.sh
      - name: Run episode progress, history and show parsing tests
        working-directory: ${{ github.workspace }}
        run: tools/audiobookshelf-episode-test.sh
      - name: Run the outbox and decision unit tests
        working-directory: ${{ github.workspace }}
        run: bash tools/audiobookshelf-outbox-test.sh
      - name: Run the profile store unit tests (§11.6/§14.2)
        working-directory: ${{ github.workspace }}
        run: bash tools/audiobookshelf-profiles-test.sh
      - name: Run the browse query and search-contract tests (§10.3)
        working-directory: ${{ github.workspace }}
        run: bash tools/audiobookshelf-browse-test.sh
      - name: Run the book-detail model/parser and description-policy tests (§9.1–§9.4)
        working-directory: ${{ github.workspace }}
        run: bash tools/audiobookshelf-detail-test.sh
      - name: Run the download-queue foundation tests (§8.1–8.2)
        working-directory: ${{ github.workspace }}
        run: bash tools/audiobookshelf-queue-test.sh
      - name: Run the download-queue GUI smoke (§8.5 lines 579/587/594)
        working-directory: ${{ github.workspace }}
        env:
          SONIX_SMOKE_SKIP_BUILD: 1
        run: tools/audiobookshelf-queueui-smoke.sh
      - name: Upload podcast logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: podcast-smoke-logs
          path: |
            build/abs-podcast-smoke.*/first.log
            build/abs-podcast-smoke.*/mock.log
            build/abs-podcast-smoke.*/progress.requests
          if-no-files-found: ignore
      - name: Upload audiobook smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiobook-host-smoke
          path: build/audiobook-host-smoke
          if-no-files-found: ignore
      - name: Upload Audiobookshelf smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiobookshelf-host-smoke
          path: build/audiobookshelf-host-smoke
          if-no-files-found: ignore
      - name: Upload the download-queue GUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiobookshelf-queueui-smoke
          path: build/audiobookshelf-queueui
          if-no-files-found: ignore